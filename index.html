<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Diário · Procurador</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e1e4ea;--ok:#1f9d55;--acc:#2b5fd9}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2c3340;--ok:#3ccf7b;--acc:#6b95ff}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:16px}
header h1{font-size:1.35rem;margin:0 0 4px}
.ver{font-size:.75rem;background:var(--acc);color:#fff;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.banner{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.subj{cursor:pointer;padding:3px 6px;border-radius:6px;display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.subj span:last-child{text-align:right;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;font-size:.85rem}
.ctl label{display:flex;flex-direction:column;gap:3px;color:var(--mut)}
.ctl input,.ctl select,.ctl button{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.ctl button{cursor:pointer}
.ctl button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.day{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:10px;padding:12px;margin:10px 0}
.day.done{opacity:.7;padding:8px 12px}
.day.done summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day.done summary::-webkit-details-marker{display:none}
.day.next{box-shadow:0 0 0 2px var(--acc)}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.dh b{font-size:1rem}
.subj:hover{background:var(--bd)}
.subj>span:first-child{color:var(--c);font-weight:bold}
@media (prefers-color-scheme:dark){.subj>span:first-child{color:color-mix(in srgb,var(--c) 55%,#fff)}}
.subj.sel{outline:2px solid var(--acc)}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.9rem}
.fbar button{font:inherit;padding:4px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer}
.tag{cursor:pointer;font-size:.72rem;border-radius:10px;padding:2px 8px;color:#fff;background:var(--c)}
.mut{color:var(--mut);font-size:.8rem}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.it input{width:20px;height:20px;margin-top:2px;flex:none;cursor:pointer}
.it.on .t{text-decoration:line-through;color:var(--mut)}
.cod{font-weight:bold;margin-right:6px}
.big{font-size:.7rem;border:1px solid var(--mut);border-radius:8px;padding:0 6px;margin-left:6px;color:var(--mut)}
.hist{margin:10px 0}
.hist>summary{cursor:pointer;padding:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--mut);font-size:.9rem}
.acoes{margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
.acoes button{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--acc);border-radius:6px;background:transparent;color:var(--acc);cursor:pointer}
.it.ro{cursor:default}
.day.fut{opacity:.85}
.hoje{font-size:.72rem;background:var(--acc);color:#fff;border-radius:10px;padding:2px 8px;margin-left:6px}
.rev{border-left:6px solid var(--acc)}
.rev h2{font-size:1rem;margin:0 0 4px}
.pill{font-size:.72rem;font-weight:bold;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.pill.atraso{border-color:#c0392b;color:#c0392b}
.rev .it.on .t{opacity:.7}
.prox{margin-top:8px}
.prox>summary{cursor:pointer;color:var(--mut);font-size:.85rem}
.prox .dt{font-size:.8rem;font-weight:bold;margin:8px 0 2px;color:var(--mut)}
.prox .pl{font-size:.85rem;padding:2px 0}
</style>
</head>

    h+=`<details class="prox"><summary>Próximas revisões, 7 dias (${prox.length})</summary>`+Object.keys(g).sort().map(d=>`<div class="dt">${fmtD(d)}</div>`+g[d].map(r=>`<div class="pl"><span class="pill" style="margin-left:0">${r.n}d</span> ${tag({m:r.m})} <span class="cod">${esc(r.c)}</span><span class="mut">${esc(IDX[r.m][r.c][1])}</span></div>`).join("")).join("")+`</details>`;
  }
  return h+"</div>";
}
let FILTRO="",HISTABERTO=false;

/* Fila = assuntos ainda não marcados, em ordem de numeração, em rodízio entre as matérias.
   O dia atual fica congelado; o que não foi marcado volta ao início da fila da matéria. */
function gerar(){
  const emAtual=new Set(S.atual?S.atual.it.map(c=>kid(S.atual.m,c)):[]);
  const f=MATERIAS.map(m=>({m,q:m.itens.filter(it=>!S.feitos[kid(m.id,it[0])]&&!emAtual.has(kid(m.id,it[0]))),i:0}));
  const ult=S.atual?S.atual.m:(S.fechados.length?S.fechados[S.fechados.length-1].m:null);
  let p=ult?(MATERIAS.findIndex(m=>m.id===ult)+1)%MATERIAS.length:0;
  const dias=[];
  while(f.some(x=>x.i<x.q.length)){
    const x=f[p];p=(p+1)%f.length;
    if(x.i>=x.q.length)continue;
    const a=x.q[x.i],sel=[a];
    if(a[2]<LIMITE&&x.i+1<x.q.length&&x.q[x.i+1][2]<LIMITE)sel.push(x.q[x.i+1]);
    x.i+=sel.length;dias.push({m:x.m.id,it:sel.map(i=>i[0])});
  }
  return dias;
}
const completo=d=>d.it.every(c=>S.feitos[kid(d.m,c)]);
function garantirAtual(){
  if(S.atual&&completo(S.atual)){S.fechados.push(S.atual);S.atual=null}
  if(!S.atual){const g=gerar();if(g.length)S.atual=g[0]}
}
function itensHtml(d,edit){
  return d.it.map(c=>{
    const it=IDX[d.m][c],k=kid(d.m,c),on=S.feitos[k];
    const corpo=`<span class="cod">${esc(c)}</span>${esc(it[1])}${it[2]>=LIMITE?'<span class="big">assunto grande</span>':""}<div class="mut">${it[3]?esc(it[3])+" · ":""}${it[2]} questões</div>`;
    return edit?`<label class="it ${on?"on":""}"><input type="checkbox" data-k="${esc(k)}" ${on?"checked":""}><div class="t">${corpo}</div></label>`
      :`<div class="it ro"><div class="t">${corpo}</div></div>`}).join("");
}
const tag=d=>`<span class="tag" data-m="${d.m}">${esc(MAT[d.m].nome)}</span>`;
function diaHist(d,n){
  const r=d.it.map(c=>(S.feitos[kid(d.m,c)]?"✓ ":"↻ ")+esc(c)).join(" · ");
  return `<details class="day done" style="--c:${MAT[d.m].cor}"><summary><b>Dia ${n}</b> ${tag(d)} <span class="mut">${r}</span></summary>${itensHtml(d,true)}</details>`;
}
const diaAtual=(d,n)=>`<div class="day next" style="--c:${MAT[d.m].cor}"><div class="dh"><b>Dia ${n}<span class="hoje">atual</span></b>${tag(d)}</div>${itensHtml(d,true)}<div class="acoes"><button data-reprog>Reprogramar o que faltou</button></div></div>`;
const diaFut=(d,n)=>`<div class="day fut" style="--c:${MAT[d.m].cor}"><div class="dh"><b>Dia ${n}</b>${tag(d)}</div>${itensHtml(d,false)}</div>`;

function previsao(total,feitos){
  const el=document.getElementById("prev"),rest=total-feitos,datas=Object.values(S.log).sort();
  if(!datas.length){el.textContent="Marque assuntos para ver o ritmo e a previsão de término.";return}
  if(rest<=0){el.textContent="Todos os assuntos concluídos!";return}
  const h=new Date(hoje()+"T12:00:00"),prim=new Date(datas[0]+"T12:00:00");
  const desde=Math.round((h-prim)/864e5)+1,janela=Math.max(1,Math.min(14,desde));
  const corte=new Date(h);corte.setDate(corte.getDate()-(janela-1));
  const c=corte.toLocaleDateString("sv-SE"),n=datas.filter(d=>d>=c).length;
  if(!n){el.textContent="Sem marcações nos últimos 14 dias. A previsão volta quando você retomar.";return}
  const ritmo=n/janela,dias=Math.ceil(rest/ritmo),fim=new Date(h);fim.setDate(fim.getDate()+dias);
  el.textContent=`Ritmo: ${ritmo.toFixed(1).replace(".",",")} assuntos/dia (${desde>=14?"últimos 14 dias":"desde o início"}) · faltam ${rest} assuntos (~${dias} dias) · término previsto: ${fim.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}${janela<3?" · estimativa inicial":""}`;
}
function render(){
  const total=MATERIAS.reduce((a,m)=>a+m.itens.length,0);
  const feitos=MATERIAS.reduce((a,m)=>a+m.itens.filter(it=>S.feitos[kid(m.id,it[0])]).length,0);
  document.getElementById("geral").textContent=`${feitos} de ${total} assuntos · ${S.fechados.length} dias estudados`;
  document.getElementById("geralbar").style.width=(feitos/total*100)+"%";
  previsao(total,feitos);
  document.getElementById("mats").innerHTML=MATERIAS.map(m=>{
    const f=m.itens.filter(it=>S.feitos[kid(m.id,it[0])]).length,p=f/m.itens.length*100;
    return `<div class="subj ${FILTRO===m.id?"sel":""}" data-m="${m.id}" style="--c:${m.cor}"><span>${esc(m.nome)}</span><div class="bar"><i style="width:${p}%;background:${m.cor}"></i></div><span>${f}/${m.itens.length}</span></div>`}).join("");
  const fm=FILTRO,ok=d=>!fm||d.m===fm,na=S.fechados.length+1;
  let h=fm?`<div class="fbar"><span>Mostrando só: <b>${esc(MAT[fm].nome)}</b></span><button data-m="">Mostrar todas</button></div>`:"";
  h+=revHtml(ok);
  const hist=S.fechados.map((d,i)=>({d,n:i+1})).filter(x=>ok(x.d));
  if(hist.length)h+=`<details class="hist" ${HISTABERTO?"open":""}><summary>Dias anteriores (${hist.length})</summary>${hist.map(x=>diaHist(x.d,x.n)).join("")}</details>`;
  if(S.atual&&ok(S.atual))h+=diaAtual(S.atual,na);
  gerar().forEach((d,i)=>{if(ok(d))h+=diaFut(d,na+1+i)});
  if(!S.atual)h+='<div class="panel">Todos os assuntos foram concluídos. Parabéns!</div>';
  document.getElementById("lista").innerHTML=h;
}
const lista=document.getElementById("lista");
lista.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("hist"))HISTABERTO=e.target.open},true);
lista.addEventListener("change",e=>{
  const r=e.target.dataset.r;
  if(r){if(e.target.checked)S.rev[r]=hoje();else delete S.rev[r];salvar();render();return}
  const k=e.target.dataset.k;if(!k)return;
  if(e.target.checked){S.feitos[k]=1;S.log[k]=hoje()}else{delete S.feitos[k];delete S.log[k];INTERV.forEach(n=>delete S.rev[k+"|"+n])}
  garantirAtual();salvar();render();
});
lista.addEventListener("click",e=>{
  if(!e.target.closest("[data-reprog]"))return;
  if(confirm("Encerrar este dia? O que não foi marcado volta para a fila da matéria.")){
    S.fechados.push(S.atual);S.atual=null;garantirAtual();salvar();render();
  }
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-m]");if(!el)return;
  e.preventDefault();
  const v=el.dataset.m;FILTRO=(v===""||FILTRO===v)?"":v;
  render();
  lista.scrollIntoView({behavior:"smooth",block:"start"});
});
garantirAtual();salvar();render();
</script>
</body>
